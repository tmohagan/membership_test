<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tim O'Hagan's Upsell Trainer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* CRT Effect for MARS Screen */
        .mars-screen {
            background: #1e293b;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Icons ---
        const Icon = ({ path, className, size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{path}</svg>
        );
        const Icons = {
            MessageCircle: (props) => <Icon path={<><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /></>} {...props} />,
            User: (props) => <Icon path={<><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></>} {...props} />,
            CheckCircle: (props) => <Icon path={<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></>} {...props} />,
            XCircle: (props) => <Icon path={<><circle cx="12" cy="12" r="10" /><line x1="15" y1="9" x2="9" y2="15" /><line x1="9" y1="9" x2="15" y2="15" /></>} {...props} />,
            ArrowRight: (props) => <Icon path={<><line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" /></>} {...props} />,
            Target: (props) => <Icon path={<><circle cx="12" cy="12" r="10" /><circle cx="12" cy="12" r="6" /><circle cx="12" cy="12" r="2" /></>} {...props} />,
            Zap: (props) => <Icon path={<><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></>} {...props} />,
            RefreshCw: (props) => <Icon path={<><path d="M21 2v6h-6" /><path d="M3 12a9 9 0 0 1 15-6.7L21 8" /><path d="M3 22v-6h6" /><path d="M21 12a9 9 0 0 1-15 6.7L3 16" /></>} {...props} />,
            CreditCard: (props) => <Icon path={<><rect width="20" height="14" x="2" y="5" rx="2" /><line x1="2" x2="22" y1="10" y2="10" /></>} {...props} />,
            Fuel: (props) => <Icon path={<><path d="M3 22v-8a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v8" /><path d="M11 22h-8" /><path d="M14 22v-8a2 2 0 0 0-2-2h-1" /><path d="M14 13a2 2 0 1 0 4 0v-3a2 2 0 0 0-2-2h-2" /><path d="M14 8h-1" /></>} {...props} />,
            TrendingUp: (props) => <Icon path={<><polyline points="23 6 13.5 15.5 8.5 10.5 1 18" /><polyline points="17 6 23 6 23 12" /></>} {...props} />,
            Eye: (props) => <Icon path={<><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" /></>} {...props} />
        };

        const CheatSheet = () => (
            <div className="bg-slate-100 rounded-xl p-4 border border-slate-200 text-xs md:text-sm space-y-4">
                <div className="font-bold text-gray-700 uppercase tracking-wider border-b border-gray-300 pb-2 mb-2 flex items-center gap-2">
                    <Icons.TrendingUp size={16} /> Strategy Cheat Sheet
                </div>
                
                {/* Club -> Club+ */}
                <div className="space-y-1">
                    <div className="font-bold text-blue-600 flex justify-between">
                        <span>Club → Club+</span>
                        <span className="text-gray-500 font-normal">($60 Prorated)</span>
                    </div>
                    <ul className="pl-2 space-y-1 text-gray-600">
                        <li>• <span className="font-semibold text-gray-800">2% Rewards</span> back</li>
                        <li>• <span className="font-semibold text-gray-800">5¢/gal</span> gas savings</li>
                        <li>• <span className="font-semibold text-gray-800">2 Free Deliveries</span> ($30 value)</li>
                        <li>• "100% Money Back Guarantee"</li>
                    </ul>
                </div>

                {/* Club -> One */}
                <div className="space-y-1">
                    <div className="font-bold text-green-600 flex justify-between">
                        <span>Club → One</span>
                        <span className="text-gray-500 font-normal">(No Fee)</span>
                    </div>
                    <ul className="pl-2 space-y-1 text-gray-600">
                        <li>• <span className="font-semibold text-gray-800">3% Rewards</span> back</li>
                        <li>• <span className="font-semibold text-gray-800">10¢/gal</span> gas savings</li>
                        <li>• "At no additional cost!"</li>
                    </ul>
                </div>

                {/* One -> One+ */}
                <div className="space-y-1">
                    <div className="font-bold text-purple-600 flex justify-between">
                        <span>One → One+</span>
                        <span className="text-gray-500 font-normal">($60 Prorated)</span>
                    </div>
                    <ul className="pl-2 space-y-1 text-gray-600">
                        <li>• <span className="font-semibold text-gray-800">3% → 5% Rewards</span></li>
                        <li>• <span className="font-semibold text-gray-800">10¢ → 15¢</span> gas savings</li>
                        <li>• "With $30 delivery benefit, you're ahead!"</li>
                    </ul>
                </div>

                {/* Club+ -> One+ */}
                <div className="space-y-1">
                    <div className="font-bold text-purple-800 flex justify-between">
                        <span>Club+ → One+</span>
                        <span className="text-gray-500 font-normal">(No Fee)</span>
                    </div>
                    <ul className="pl-2 space-y-1 text-gray-600">
                        <li>• "More than <span className="font-semibold text-gray-800">Double Rewards</span> (2% to 5%)"</li>
                        <li>• "<span className="font-semibold text-gray-800">Triple Gas Savings</span> (5¢ to 15¢)"</li>
                    </ul>
                </div>
            </div>
        );

        const App = () => {
            // Game State
            const [view, setView] = useState('intro'); // intro, scenario, summary
            const [scenarioIdx, setScenarioIdx] = useState(0);
            const [interactionStage, setInteractionStage] = useState('mars'); // mars, discovery, pitch, feedback
            const [dialogueLog, setDialogueLog] = useState([]);
            const [score, setScore] = useState(0);
            const [feedback, setFeedback] = useState(null);
            
            // Ref for auto-scrolling chat
            const chatEndRef = useRef(null);
            const scrollToBottom = () => chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
            useEffect(scrollToBottom, [dialogueLog]);

            // --- Scenarios Data ---
            const scenarios = [
                {
                    id: 1,
                    customer: "Sarah Jenkins",
                    tier: "Club",
                    context: "Picking up membership card.",
                    avatar: "bg-blue-100 text-blue-600",
                    marsData: {
                        status: "Active",
                        type: "Club Member",
                        joined: "2019",
                        creditCard: "N/A"
                    },
                    intro: "Hi, I'm just here to pick up my new card. I want to get in and out quickly.",
                    hiddenNeed: "gas", 
                    discoveryOptions: [
                        {
                            text: "Do you plan on using our Same-Day Delivery service often?",
                            reveals: "delivery_rejection",
                            response: "Honestly, no. I like to pick my own produce. I don't trust delivery drivers with my fruit!",
                            hint: "She rejected delivery. Don't pitch it."
                        },
                        {
                            text: "Welcome! Did you drive far to get to us today?",
                            reveals: "gas_need",
                            response: "About 20 minutes. I actually passed three other gas stations to get here—prices are crazy right now.",
                            hint: "She cares about gas prices. Pivot to fuel savings."
                        },
                        {
                            text: "Would you like to upgrade for $60 today?",
                            reveals: "price_shock",
                            response: "Whoa, I just paid for this membership. I'm not looking to spend more money.",
                            hint: "Too direct. You triggered price resistance."
                        }
                    ],
                    pitchOptions: [
                        {
                            targetNeed: "delivery",
                            text: "You should get Club+. It includes 2 free Same-Day Deliveries worth $30, so it pays for itself.",
                            result: "fail",
                            feedback: "Missed the mark. Sarah explicitly said she doesn't use delivery. Pitching a benefit the customer doesn't value makes them feel unheard.",
                            coachTip: "Always listen to the 'No'. If they reject delivery, pivot to Gas or Rewards immediately."
                        },
                        {
                            targetNeed: "gas",
                            text: "Since you're driving a bit to get here, moving to Club+ saves you 5¢/gal on gas instantly. Plus you'll earn 2% back on everything you buy today.",
                            result: "success",
                            feedback: "Perfect! You identified her pain point (gas prices/driving) and offered the specific solution (5¢ off/gal) plus the reward kicker.",
                            coachTip: "Great connection! Distance driven = Gas Pitch. It's the most reliable formula."
                        },
                        {
                            targetNeed: "generic",
                            text: "Club+ is great because it has a 100% Money Back Guarantee.",
                            result: "weak",
                            feedback: "The guarantee is a safety net, not a hook. Lead with the Gas Savings first, then use the guarantee to close if she hesitates.",
                            coachTip: "Use the Guarantee as a 'Closer', not an 'Opener'."
                        }
                    ]
                },
                {
                    id: 2,
                    customer: "Mike Ross",
                    tier: "Club",
                    context: "Buying a large TV at checkout.",
                    avatar: "bg-green-100 text-green-600",
                    marsData: {
                        status: "Active",
                        type: "Club Member",
                        joined: "2021",
                        creditCard: "None"
                    },
                    intro: "Just grabbing this TV today. Hopefully it fits in my car!",
                    hiddenNeed: "rewards",
                    discoveryOptions: [
                        {
                            text: "That's a nice TV! Are you using a BJ's credit card to pay for that?",
                            reveals: "payment_method",
                            response: "No, just my debit card. I don't like annual fees on credit cards.",
                            hint: "He pays with debit and fears fees. Pitch the NO FEE aspect."
                        },
                        {
                            text: "Do you want to apply for a Mastercard to save 10 cents on gas?",
                            reveals: "gas_mild",
                            response: "I guess? I don't buy gas that often though. My commute is short.",
                            hint: "Gas isn't his trigger. Look for something related to his big purchase."
                        }
                    ],
                    pitchOptions: [
                        {
                            targetNeed: "gas",
                            text: "You should get the One Mastercard. You'll save 10 cents on gas every time you fill up.",
                            result: "weak",
                            feedback: "He told you he doesn't buy gas often. While true, this benefit isn't compelling enough to make him apply right now.",
                            coachTip: "Relevance is key. Don't pitch gas to someone buying a TV unless they mention a long drive."
                        },
                        {
                            targetNeed: "rewards",
                            text: "If you open the One Mastercard today, you'll earn 3% back on this TV instantly. That's a significant reward, and the card has absolutely no annual fee.",
                            result: "success",
                            feedback: "Excellent. You connected the pitch to his current action (buying a TV), highlighted the 3% reward, and addressed his objection about fees.",
                            coachTip: "Big Ticket Items = Instant Rewards Pitch. Always do the math for them."
                        }
                    ]
                },
                {
                    id: 3,
                    customer: "Linda Miles",
                    tier: "Club+",
                    context: "Customer Service Desk - Coupon Inquiry",
                    avatar: "bg-purple-100 text-purple-600",
                    marsData: {
                        status: "Active",
                        type: "Club+ Member",
                        joined: "2015",
                        creditCard: "None"
                    },
                    intro: "Hi, do you have any extra coupon books? I left mine at home.",
                    hiddenNeed: "maximizer",
                    discoveryOptions: [
                        {
                            text: "Here you go. Anything else?",
                            reveals: "none",
                            response: "Nope, that's it. Thanks.",
                            hint: "You ended the interaction too early! Remember: 'Every interaction is an opportunity.'"
                        },
                        {
                            text: "Here is a book! Since you clearly love deals, are you earning your max rewards with the One+ card yet?",
                            reveals: "maximizer",
                            response: "I have the Club+ membership for the 2% back, but I don't have the credit card. Is it worth it?",
                            hint: "She is a 'Maximizer'. She likes deals/rewards. Pitch the multiplier."
                        }
                    ],
                    pitchOptions: [
                        {
                            targetNeed: "delivery",
                            text: "The One+ card gives you free delivery and pickup perks.",
                            result: "fail",
                            feedback: "She already has Club+, so she ALREADY has those perks. You need to offer NEW value (the 5% rewards).",
                            coachTip: "Know what they already have. Pitching existing benefits confuses the member."
                        },
                        {
                            targetNeed: "maximizer",
                            text: "It absolutely is. Combined with your Club+, the One+ card more than doubles your rewards to 5% back and triples your gas savings to 15¢ off/gal.",
                            result: "success",
                            feedback: "Boom. You used the 'Double Rewards / Triple Gas' math from the training guide. High impact for a deal-seeking member.",
                            coachTip: "Use 'Multipliers' (Double/Triple) for existing elite members. It sounds more impressive than just stating percentages."
                        }
                    ]
                },
                {
                    id: 4,
                    customer: "Gary Wilson",
                    tier: "Club",
                    context: "Complaining about gas prices at Service Desk.",
                    avatar: "bg-slate-200 text-slate-600",
                    marsData: {
                        status: "Active",
                        type: "Club Member",
                        joined: "2020",
                        creditCard: "N/A"
                    },
                    intro: "I can't believe gas went up another 20 cents. It's getting ridiculous.",
                    hiddenNeed: "cost_savings",
                    discoveryOptions: [
                        {
                            text: "I know, it's tough. Do you fill up here often?",
                            reveals: "gas_focus",
                            response: "Every week. It's the only reason I keep the membership.",
                            hint: "He is price sensitive. Offer the maximum savings option."
                        },
                        {
                            text: "Well, at least our prices are lower than the station across the street!",
                            reveals: "agreement",
                            response: "Barely.",
                            hint: "Commiserating is okay, but you need to pivot to a solution."
                        }
                    ],
                    pitchOptions: [
                        {
                            targetNeed: "club_plus",
                            text: "You should upgrade to Club+. It saves you 5 cents a gallon.",
                            result: "weak",
                            feedback: "Good, but not the BEST. Club+ costs money ($60). The One Card is FREE and saves him double that (10 cents). Pitch the better value first.",
                            coachTip: "For price complainers, 'Free' solutions (One Card) usually land better than 'Paid' upgrades (Club+)."
                        },
                        {
                            targetNeed: "one_card",
                            text: "If you switch to the BJ's One Mastercard, you'll save 10 cents a gallon instantly, and it has NO annual fee. It's the best way to fight these prices.",
                            result: "success",
                            feedback: "Excellent. You offered the 'No Additional Cost' solution that doubles his savings (10¢ vs standard). This addresses his complaint directly.",
                            coachTip: "The 'No Annual Fee' + '10¢ Savings' combo is the ultimate silencer for gas price complaints."
                        }
                    ]
                },
                {
                    id: 7, // New Pivot Scenario
                    customer: "Karen Miller",
                    tier: "Club",
                    context: "Checkout - Credit Averse",
                    avatar: "bg-red-100 text-red-600",
                    marsData: {
                        status: "Active",
                        type: "Club Member",
                        joined: "2010",
                        creditCard: "None"
                    },
                    intro: "I'm just paying with cash today. I don't believe in credit cards.",
                    hiddenNeed: "pivot_opportunity",
                    discoveryOptions: [
                        {
                            text: "I understand. But our credit card gives you 3% back!",
                            reveals: "anger",
                            response: "I said I don't use them. I prefer to live debt free.",
                            hint: "She is hostile to credit. Pivot immediately to Club+ (Debit/Cash friendly)."
                        },
                        {
                            text: "That's smart! You can actually still earn rewards without a credit card. Have you looked at Club+?",
                            reveals: "curiosity",
                            response: "No, what is that? Is it a credit card?",
                            hint: "Perfect pivot. You validated her stance and offered a non-credit alternative."
                        }
                    ],
                    pitchOptions: [
                        {
                            targetNeed: "rewards_pivot",
                            text: "Not at all. Club+ is just a membership upgrade. You keep paying with cash, but you start earning 2% back and get 5¢ off gas.",
                            result: "success",
                            feedback: "Textbook Pivot. You respected her boundary (No Credit) but still found an upsell (Club+) that fits her lifestyle.",
                            coachTip: "The 'Anti-Credit' customer is the perfect candidate for Club+. Don't force the One Card."
                        },
                        {
                            targetNeed: "one_card_push",
                            text: "But the One Card has no annual fee and gives you 3% back. It's better than cash.",
                            result: "fail",
                            feedback: "You failed to listen. Pushing a credit card on someone who explicitly said 'I don't believe in them' destroys trust.",
                            coachTip: "Never argue with a customer's philosophy. Pivot to an option that respects their values."
                        }
                    ]
                }
            ];

            // --- Handlers ---
            
            const startScenario = () => {
                setInteractionStage('mars');
                setDialogueLog([]);
                setFeedback(null);
            };

            const handleMarsSelection = (selectedTier) => {
                const actualTier = scenarios[scenarioIdx].tier;
                if (selectedTier === actualTier) {
                    setInteractionStage('discovery');
                    setDialogueLog([{ 
                        speaker: 'customer', 
                        text: scenarios[scenarioIdx].intro 
                    }]);
                } else {
                    // Flash error or deduction (simplified here)
                    alert(`Incorrect identification. The MARS data shows this member is: ${actualTier}. Look closely at the profile.`);
                }
            };

            const handleDiscoveryChoice = (option) => {
                // Add user question
                const newLog = [...dialogueLog, { speaker: 'you', text: option.text }];
                
                // Add customer response (simulated delay for realism)
                setTimeout(() => {
                    setDialogueLog([
                        ...newLog, 
                        { speaker: 'customer', text: option.response, hint: option.hint }
                    ]);
                    setInteractionStage('pitch');
                }, 600);
            };

            const handlePitchChoice = (option) => {
                // Add user pitch
                setDialogueLog(prev => [...prev, { speaker: 'you', text: option.text }]);
                
                // Determine result
                if (option.result === 'success') {
                    setScore(score + 100);
                    setFeedback({ type: 'success', text: option.feedback, tip: option.coachTip });
                } else if (option.result === 'weak') {
                    setScore(score + 50);
                    setFeedback({ type: 'warning', text: option.feedback, tip: option.coachTip });
                } else {
                    setFeedback({ type: 'error', text: option.feedback, tip: option.coachTip });
                }
                setInteractionStage('feedback');
            };

            const nextScenario = () => {
                if (scenarioIdx < scenarios.length - 1) {
                    setScenarioIdx(scenarioIdx + 1);
                    startScenario();
                } else {
                    setView('summary');
                }
            };

            // --- Components ---

            const ChatBubble = ({ entry }) => (
                <div className={`flex flex-col mb-4 ${entry.speaker === 'you' ? 'items-end' : 'items-start'} fade-in`}>
                    <div className={`max-w-[80%] p-4 rounded-2xl shadow-sm text-sm md:text-base leading-relaxed ${
                        entry.speaker === 'you' 
                        ? 'bg-blue-600 text-white rounded-br-none' 
                        : 'bg-white border border-gray-200 text-gray-800 rounded-bl-none'
                    }`}>
                        {entry.text}
                    </div>
                    {entry.hint && (
                        <div className="mt-2 text-xs font-semibold text-orange-600 bg-orange-50 px-2 py-1 rounded inline-flex items-center gap-1">
                            <Icons.Target size={12} /> Insight: {entry.hint}
                        </div>
                    )}
                    <span className="text-xs text-gray-400 mt-1 capitalize">{entry.speaker}</span>
                </div>
            );

            // --- Views ---

            if (view === 'intro') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-slate-50">
                        <div className="max-w-2xl w-full bg-white rounded-2xl shadow-xl overflow-hidden">
                            <div className="bg-blue-700 p-10 text-center">
                                <div className="mx-auto bg-white/10 w-20 h-20 rounded-full flex items-center justify-center mb-6">
                                    <Icons.Eye className="text-white w-10 h-10" />
                                </div>
                                <h1 className="text-3xl font-bold text-white mb-2">Tim O'Hagan's Upsell Simulator</h1>
                                <p className="text-blue-200 font-medium mb-4">Version 1 Beta Demo</p>
                                <p className="text-blue-100 text-lg">New Module: <strong>MARS 2.0 Identification</strong><br/>Identify, Discover, Pitch.</p>
                            </div>
                            <div className="p-8 space-y-6">
                                <div className="bg-orange-50 border-l-4 border-orange-500 p-4 rounded-r-lg">
                                    <h3 className="font-bold text-orange-800">New Process Enforced</h3>
                                    <p className="text-sm text-orange-700 mt-1">
                                        You can no longer skip the identification step. You must analyze the Member Profile first, just like in real life.
                                    </p>
                                </div>
                                <button onClick={() => { setView('scenario'); startScenario(); }} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition-transform hover:scale-[1.01] flex items-center justify-center gap-2">
                                    Start Training <Icons.ArrowRight />
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'summary') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center">
                            <h2 className="text-3xl font-bold text-gray-800 mb-2">Simulation Complete</h2>
                            <div className="text-6xl font-bold text-blue-600 my-6">{score}</div>
                            <p className="text-gray-600 mb-8">
                                {score >= 500 ? "Perfect Score! You are a master at MARS 2.0 and pivoting." : "Good effort. Review the Coach's Corner tips to refine your pivots."}
                            </p>
                            <button onClick={() => window.location.reload()} className="w-full bg-gray-800 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2">
                                <Icons.RefreshCw size={18} /> Restart
                            </button>
                        </div>
                    </div>
                );
            }

            // Scenario View
            const currentScenario = scenarios[scenarioIdx];

            return (
                <div className="min-h-screen flex flex-col md:flex-row max-w-7xl mx-auto md:p-6 gap-6">
                    
                    {/* Left Panel: Customer Profile & Cheat Sheet */}
                    <div className="w-full md:w-1/3 space-y-4 p-4 md:p-0">
                        {/* Profile Card / MARS Screen */}
                        <div className={`bg-white rounded-2xl shadow-sm border overflow-hidden transition-all ${interactionStage === 'mars' ? 'ring-4 ring-blue-400 border-blue-400' : 'border-gray-200'}`}>
                            <div className="p-4 bg-gray-900 text-white flex justify-between items-center">
                                <span className="font-mono text-sm tracking-widest">MARS 2.0 CRM</span>
                                <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                            </div>
                            <div className="p-6 space-y-4 bg-slate-50 font-mono text-sm">
                                <div className="flex items-center gap-4 border-b border-gray-200 pb-4">
                                    <div className={`w-12 h-12 bg-gray-200 rounded-full flex items-center justify-center`}>
                                        <Icons.User className="text-gray-500" />
                                    </div>
                                    <div>
                                        <div className="text-gray-500 text-xs">MEMBER NAME</div>
                                        <div className="text-lg font-bold text-gray-800">{currentScenario.customer}</div>
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <div className="text-gray-500 text-xs">MEMBER SINCE</div>
                                        <div className="font-bold text-gray-700">{currentScenario.marsData.joined}</div>
                                    </div>
                                    <div>
                                        <div className="text-gray-500 text-xs">CREDIT CARD</div>
                                        <div className="font-bold text-gray-700">{currentScenario.marsData.creditCard}</div>
                                    </div>
                                    <div className="col-span-2 bg-yellow-50 p-2 rounded border border-yellow-200">
                                        <div className="text-xs text-yellow-700 font-bold">SYSTEM ALERT</div>
                                        <div className="text-yellow-800">Upsell Opportunity Detected</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Cheat Sheet */}
                        <CheatSheet />

                        <div className="flex flex-col gap-2 px-2">
                            <div className="flex justify-between items-center text-sm text-gray-400">
                                <span>Scenario {scenarioIdx + 1} of {scenarios.length}</span>
                                <span>Score: {score}</span>
                            </div>
                            <div className="text-center text-xs text-gray-300 font-medium mt-2">
                                App by Tim O'Hagan
                            </div>
                        </div>
                    </div>

                    {/* Right Panel: Interaction Area */}
                    <div className="w-full md:w-2/3 flex flex-col h-[85vh] md:h-auto bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden relative">
                        
                        {/* Phase 0: MARS Selection Overlay */}
                        {interactionStage === 'mars' && (
                            <div className="absolute inset-0 bg-white/95 z-50 flex flex-col items-center justify-center p-8 text-center fade-in">
                                <div className="bg-blue-100 p-4 rounded-full mb-4">
                                    <Icons.Eye className="text-blue-600 w-8 h-8" />
                                </div>
                                <h2 className="text-2xl font-bold text-gray-900 mb-2">Step 1: Identification</h2>
                                <p className="text-gray-600 mb-8 max-w-md">
                                    Look at the MARS 2.0 CRM screen on the left. Based on the data, identify this member's current tier to proceed.
                                </p>
                                <div className="grid grid-cols-2 gap-4 w-full max-w-lg">
                                    {['Club', 'Club+', 'One Mastercard', 'One+ Mastercard'].map((tier) => (
                                        <button
                                            key={tier}
                                            onClick={() => handleMarsSelection(tier === 'One Mastercard' || tier === 'One+ Mastercard' ? tier.replace(' Mastercard', '') : tier)}
                                            className="p-4 border-2 border-gray-200 rounded-xl hover:border-blue-500 hover:bg-blue-50 font-bold text-gray-700 transition-all"
                                        >
                                            {tier}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Chat History */}
                        <div className="flex-1 overflow-y-auto p-6 bg-slate-50 custom-scrollbar">
                            {dialogueLog.map((entry, i) => (
                                <ChatBubble key={i} entry={entry} />
                            ))}
                            <div ref={chatEndRef} />
                        </div>

                        {/* Controls Area */}
                        <div className="p-6 border-t border-gray-200 bg-white min-h-[250px]">
                            
                            {interactionStage === 'discovery' && (
                                <div className="fade-in">
                                    <h3 className="text-sm font-bold text-gray-400 uppercase mb-4 flex items-center gap-2">
                                        <div className="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></div>
                                        Phase 2: Discovery - What do you ask?
                                    </h3>
                                    <div className="grid gap-3">
                                        {currentScenario.discoveryOptions.map((opt, i) => (
                                            <button 
                                                key={i}
                                                onClick={() => handleDiscoveryChoice(opt)}
                                                className="text-left p-4 rounded-xl border border-gray-200 hover:border-blue-500 hover:bg-blue-50 transition-all text-gray-700 text-sm md:text-base font-medium"
                                            >
                                                "{opt.text}"
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {interactionStage === 'pitch' && (
                                <div className="fade-in">
                                    <h3 className="text-sm font-bold text-gray-400 uppercase mb-4 flex items-center gap-2">
                                        <div className="w-2 h-2 bg-orange-500 rounded-full animate-pulse"></div>
                                        Phase 3: The Pitch - Choose the best benefit
                                    </h3>
                                    <div className="grid gap-3">
                                        {currentScenario.pitchOptions.map((opt, i) => (
                                            <button 
                                                key={i}
                                                onClick={() => handlePitchChoice(opt)}
                                                className="text-left p-4 rounded-xl border border-gray-200 hover:border-blue-500 hover:bg-blue-50 transition-all text-gray-700 text-sm md:text-base font-medium group"
                                            >
                                                <div className="flex justify-between items-center mb-1">
                                                    <span className="font-bold text-xs text-gray-400 group-hover:text-blue-500 uppercase">Focus: {opt.targetNeed}</span>
                                                </div>
                                                "{opt.text}"
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {interactionStage === 'feedback' && feedback && (
                                <div className={`p-6 rounded-xl text-center fade-in ${
                                    feedback.type === 'success' ? 'bg-green-50 border border-green-200' : 
                                    feedback.type === 'warning' ? 'bg-yellow-50 border border-yellow-200' :
                                    'bg-red-50 border border-red-200'
                                }`}>
                                    <div className={`inline-flex p-3 rounded-full mb-3 ${
                                        feedback.type === 'success' ? 'bg-green-100 text-green-600' : 
                                        feedback.type === 'warning' ? 'bg-yellow-100 text-yellow-600' :
                                        'bg-red-100 text-red-600'
                                    }`}>
                                        {feedback.type === 'success' ? <Icons.CheckCircle size={32} /> : <Icons.XCircle size={32} />}
                                    </div>
                                    <h3 className={`text-lg font-bold mb-2 ${
                                        feedback.type === 'success' ? 'text-green-800' : 
                                        feedback.type === 'warning' ? 'text-yellow-800' :
                                        'text-red-800'
                                    }`}>
                                        {feedback.type === 'success' ? 'Upsell Successful!' : 
                                         feedback.type === 'warning' ? 'Weak Pitch' : 'Upsell Failed'}
                                    </h3>
                                    <p className="text-gray-600 mb-4 max-w-lg mx-auto">{feedback.text}</p>
                                    
                                    {/* Coach's Corner Section */}
                                    <div className="bg-white/60 rounded-lg p-4 mb-6 max-w-lg mx-auto text-left border border-black/5">
                                        <div className="text-xs font-bold uppercase tracking-wider text-gray-500 mb-1 flex items-center gap-1">
                                            <Icons.Zap size={12} /> Coach's Corner
                                        </div>
                                        <p className="text-sm font-medium text-gray-800 italic">"{feedback.tip}"</p>
                                    </div>

                                    <button 
                                        onClick={nextScenario}
                                        className="bg-gray-900 text-white font-bold py-3 px-8 rounded-lg hover:bg-black transition-colors"
                                    >
                                        Next Customer
                                    </button>
                                </div>
                            )}

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
