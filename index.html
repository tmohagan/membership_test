                            { text: "Yes, but only for this week. It basically pays for the fire pit.", score: 10, next: "success_big", feedback: "Framing the reward as a 'free item' (the fire pit) is excellent psychology." }
                        ]
                    },
                    success_big: { npc: "Well I'm not leaving a free fire pit on the table.", end: true, success: true, message: "Success! High-ticket conversion." }
                }
            },
            {
                id: "cash_h3",
                mode: "cashier",
                difficulty: "Hard",
                title: "The Inflation Complainer",
                description: "Member complaining about high food prices.",
                cashierData: {
                    items: ["Eggs", "Milk", "Butter", "Ground Beef"],
                    total: "$65.00",
                    hint: "Use the 'Inflation Shield' argument.",
                },
                dialogueTree: {
                    start: {
                        npc: "I can't believe how much eggs cost these days. It's ridiculous.",
                        options: [
                            { text: "I know, prices are up everywhere.", score: 0, next: "commiserate_only", feedback: "You agreed, but you offered no solution." },
                            { text: "It is crazy. That's why I tell people the 5% card is the only way to beat it. It basically rolls the prices back to 2023 levels.", score: 10, next: "inflation_hook", feedback: "Strong 'Inflation Shield' positioning." }
                        ]
                    },
                    commiserate_only: { npc: "It's getting too expensive to shop.", end: true, success: false, message: "Missed opportunity to solve the pain." },
                    inflation_hook: {
                        npc: "Rolls back prices?",
                        options: [
                            { text: "Getting 5% back on every single grocery run essentially negates the inflation. It's how our savvy members are staying ahead.", score: 10, next: "success_inflation", feedback: "Appealing to the 'Savvy Shopper' identity." }
                        ]
                    },
                    success_inflation: { npc: "I like the sound of beating the prices. Let's do it.", end: true, success: true, message: "Success! Sold on economy." }
                }
            }
        ];

        // --- COMPONENTS ---

        // 1. MARS SCREEN (Membership Mode)
        const MarsScreen = ({ data }) => {
            if (!data) return null;
            return (
                <div className="bg-white border border-gray-400 shadow-xl rounded-sm overflow-hidden font-sans text-sm h-full">
                    <div className="bg-black text-white p-2 flex justify-between items-center">
                        <div className="flex items-center gap-4">
                            <div className="bg-red-600 font-bold px-2 py-0.5 rounded text-lg italic tracking-tighter">BJ's</div>
                            <span className="font-light text-xl">MARS 2.0</span>
                        </div>
                        <div className="text-xs text-gray-400">MEMBERSHIP MODE</div>
                    </div>
                    <div className="bg-white p-3 border-b border-gray-200">
                        <h2 className="text-xl font-bold text-gray-800">{data.customerName}</h2>
                        <p className="text-xs text-gray-500">ID: {data.memberId} | {data.memberType}</p>
                    </div>
                    <div className="bg-gray-100 p-4 space-y-4">
                        <div className="bg-white p-3 rounded shadow-sm border border-gray-200">
                            <div className="flex justify-between items-center mb-2">
                                <p className="text-xs text-gray-500">Tier</p>
                                <p className={`text-sm font-bold ${data.tier.includes('+') ? 'text-purple-700' : 'bjs-red-text'}`}>{data.tier}</p>
                            </div>
                            <div className="grid grid-cols-2 gap-2 text-xs">
                                <div>YTD Sales: <span className="font-mono">{data.sales.ytd}</span></div>
                                <div>Potential: <span className="font-mono font-bold text-green-700">{data.rewards.potential}</span></div>
                            </div>
                        </div>
                        <div className="bg-blue-50 p-3 rounded border border-blue-200">
                             <p className="text-xs font-bold text-blue-700 uppercase mb-1">System Hint</p>
                             <p className="text-sm italic">{data.hint}</p>
                        </div>
                    </div>
                </div>
            );
        };

        // 2. SCO DISPLAY (Self-Checkout Mode)
        const ScoDisplay = ({ data }) => {
            if (!data) return null;
            return (
                <div className="bg-gray-800 border-4 border-gray-600 rounded-xl overflow-hidden font-mono h-full flex flex-col">
                    <div className="bg-gray-900 text-white p-4 text-center border-b border-gray-700">
                        <h2 className="text-2xl font-bold text-green-400 tracking-widest">SELF-CHECKOUT</h2>
                        <p className="text-xs text-gray-400">VISUAL SCAN ONLY - NO CRM DATA</p>
                    </div>
                    <div className="flex-1 p-6 bg-black">
                        <p className="text-gray-400 text-sm mb-4 border-b border-gray-700 pb-2">SCANNED ITEMS:</p>
                        <ul className="space-y-3">
                            {data.items.map((item, idx) => (
                                <li key={idx} className="text-green-500 text-lg flex items-center gap-3">
                                    <span className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                                    {item}
                                </li>
                            ))}
                        </ul>
                        <div className="mt-8 p-4 bg-gray-800 rounded text-yellow-400 text-sm">
                            <span className="font-bold block mb-1">OBSERVED BEHAVIOR:</span>
                            {data.behavior}
                        </div>
                    </div>
                     <div className="bg-blue-900 p-3 border-t border-blue-700">
                         <p className="text-xs font-bold text-white uppercase mb-1">Ambassador Hint</p>
                         <p className="text-sm text-blue-100 italic">{data.hint}</p>
                    </div>
                </div>
            );
        };

        // 3. CASHIER DISPLAY (Cashier Mode)
        const CashierDisplay = ({ data }) => {
            if (!data) return null;
            return (
                <div className="bg-blue-100 border border-blue-300 rounded shadow-xl overflow-hidden font-sans h-full flex flex-col">
                    <div className="bg-blue-800 text-white p-2 flex justify-between items-center">
                        <span className="font-bold">REGISTER #04</span>
                        <span className="text-xs bg-blue-900 px-2 py-1 rounded">CASHIER MODE</span>
                    </div>
                    <div className="flex-1 bg-white p-4 flex flex-col">
                        <div className="flex-1 overflow-y-auto border border-gray-200 mb-4 p-2 bg-gray-50">
                            <table className="w-full text-sm">
                                <thead className="border-b">
                                    <tr className="text-left text-gray-500">
                                        <th className="pb-2">Item</th>
                                        <th className="pb-2 text-right">Price</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {data.items.map((item, idx) => (
                                        <tr key={idx} className="border-b border-gray-100">
                                            <td className="py-2">{item}</td>
                                            <td className="py-2 text-right text-gray-400">--</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                        {data.event && (
                            <div className="bg-red-100 text-red-800 text-xs font-bold p-2 mb-2 text-center rounded border border-red-200 animate-pulse">
                                ⚠ EVENT: {data.event}
                            </div>
                        )}
                        <div className="border-t-2 border-black pt-4">
                            <div className="flex justify-between items-end">
                                <span className="text-xl font-bold text-gray-600">TOTAL</span>
                                <span className="text-4xl font-bold text-gray-900">{data.total}</span>
                            </div>
                        </div>
                    </div>
                     <div className="bg-yellow-50 p-3 border-t border-yellow-200">
                         <p className="text-xs font-bold text-yellow-800 uppercase mb-1">Register Hint</p>
                         <p className="text-sm text-gray-800 italic">{data.hint}</p>
                    </div>
                </div>
            );
        };

        // --- GAME CONTROLLERS ---

        const FeedbackModal = ({ feedback, score, onNext, isEnd, success }) => {
            const isGood = score >= 5;
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-lg p-6 max-w-lg w-full shadow-2xl animate-fade-in-up border-t-4 border-red-600">
                        <h3 className={`text-xl font-bold mb-2 ${!isGood ? 'text-red-600' : 'text-green-600'}`}>
                            {!isGood ? "Coach's Corner (Improvement Needed)" : "Great Job!"}
                        </h3>
                        <p className="text-gray-700 mb-6">{feedback}</p>
                        <button 
                            onClick={onNext}
                            className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition duration-200"
                        >
                            {isEnd ? (success ? "Next Scenario" : "Try Again") : "Continue Interaction"}
                        </button>
                    </div>
                </div>
            );
        };

        const ModeSelect = ({ onSelect }) => {
            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-gray-50">
                    <div className="max-w-4xl w-full">
                        <h1 className="text-4xl font-bold text-center mb-8 bjs-red-text tracking-tighter">Select Training Module</h1>
                        <div className="grid md:grid-cols-3 gap-6">
                            
                            {/* Membership Mode */}
                            <button onClick={() => onSelect('membership')} className="bg-white p-6 rounded-xl shadow-lg border-2 border-transparent hover:border-red-600 transition flex flex-col items-center text-center group">
                                <div className="text-5xl mb-4">🖥️</div>
                                <h2 className="text-xl font-bold text-gray-800 mb-2 group-hover:text-red-600">Membership Desk</h2>
                                <p className="text-sm text-gray-500">Access full MARS 2.0 data. Handle Returns, Coupon complaints, and Upgrades.</p>
                            </button>

                            {/* Self-Checkout Mode */}
                            <button onClick={() => onSelect('scoc')} className="bg-white p-6 rounded-xl shadow-lg border-2 border-transparent hover:border-green-600 transition flex flex-col items-center text-center group">
                                <div className="text-5xl mb-4">🤖</div>
                                <h2 className="text-xl font-bold text-gray-800 mb-2 group-hover:text-green-600">Self-Checkout</h2>
                                <p className="text-sm text-gray-500">Visual scan only. Assist wayfinding, push Digital App, and Pivot to sales.</p>
                            </button>

                            {/* Cashier Mode */}
                            <button onClick={() => onSelect('cashier')} className="bg-white p-6 rounded-xl shadow-lg border-2 border-transparent hover:border-blue-600 transition flex flex-col items-center text-center group">
                                <div className="text-5xl mb-4">🛒</div>
                                <h2 className="text-xl font-bold text-gray-800 mb-2 group-hover:text-blue-600">Cashier</h2>
                                <p className="text-sm text-gray-500">Items & Total only. Use "10-Second Hooks", Event Promos, and Gas Math.</p>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const DifficultySelect = ({ onSelect, mode }) => {
            const modeName = mode === 'membership' ? "Membership" : mode === 'scoc' ? "Self-Checkout" : "Cashier";
            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4">
                    <div className="bg-white p-8 rounded-xl shadow-2xl max-w-2xl w-full border-t-8 border-gray-800 text-center">
                        <h2 className="text-2xl font-bold mb-2 text-gray-800">Select Difficulty</h2>
                        <p className="text-gray-500 mb-6 uppercase text-sm font-bold tracking-widest">{modeName} Mode</p>
                        <div className="grid gap-4">
                            <button onClick={() => onSelect('Easy')} className="p-4 bg-green-50 border border-green-200 rounded hover:bg-green-100 transition text-left">
                                <h3 className="font-bold text-green-800 text-lg">Easy</h3>
                                <p className="text-sm text-gray-600">Obvious cues. Gas complaints, simple wayfinding, small carts.</p>
                            </button>
                            <button onClick={() => onSelect('Medium')} className="p-4 bg-yellow-50 border border-yellow-200 rounded hover:bg-yellow-100 transition text-left">
                                <h3 className="font-bold text-yellow-800 text-lg">Medium</h3>
                                <p className="text-sm text-gray-600">Service pivots. Coupon book requests, Gas questions, Missing rewards.</p>
                            </button>
                            <button onClick={() => onSelect('Hard')} className="p-4 bg-red-50 border border-red-200 rounded hover:bg-red-100 transition text-left">
                                <h3 className="font-bold text-red-800 text-lg">Hard</h3>
                                <p className="text-sm text-gray-600">Resistant members. Returns (Amazon), Fee objections, Rush customers.</p>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const Simulator = () => {
            const [gameState, setGameState] = useState('mode_select'); // mode_select, difficulty, playing, feedback, end_session
            const [selectedMode, setSelectedMode] = useState(null);
            const [sessionQueue, setSessionQueue] = useState([]);
            const [currentScenarioIndex, setCurrentScenarioIndex] = useState(0);
            
            // Scenario State
            const [dialogueId, setDialogueId] = useState('start');
            const [feedbackState, setFeedbackState] = useState(null);
            const [history, setHistory] = useState([]); 
            const [sessionScore, setSessionScore] = useState(0);
            const [sessionMaxScore, setSessionMaxScore] = useState(0);

            const handleModeSelect = (mode) => {
                setSelectedMode(mode);
                setGameState('difficulty');
            };

            const startSession = (difficulty) => {
                // Filter scenarios by BOTH Difficulty AND Mode
                const pool = scenarioDatabase.filter(s => s.difficulty === difficulty && s.mode === selectedMode);
                
                if (pool.length === 0) {
                    alert("No scenarios found for this configuration yet.");
                    setGameState('mode_select');
                    return;
                }

                const shuffled = [...pool].sort(() => 0.5 - Math.random());
                setSessionQueue(shuffled);
                setCurrentScenarioIndex(0);
                setSessionScore(0);
                setSessionMaxScore(shuffled.length * 20); 
                
                initScenario();
                setGameState('playing');
            };

            const initScenario = () => {
                setDialogueId('start');
                setHistory([]);
                setFeedbackState(null);
            };

            const handleChoice = (option) => {
                const currentScenario = sessionQueue[currentScenarioIndex];
                const currentDialogue = currentScenario.dialogueTree[dialogueId];
                setHistory([...history, { type: 'npc', text: currentDialogue.npc }, { type: 'user', text: option.text }]);
                setSessionScore(prev => prev + option.score);
                setFeedbackState({ text: option.feedback, score: option.score, next: option.next });
                setGameState('feedback');
            };

            const advanceDialogue = () => {
                const currentScenario = sessionQueue[currentScenarioIndex];
                const nextId = feedbackState.next;
                const nextNode = currentScenario.dialogueTree[nextId];
                
                if (nextNode && nextNode.end) {
                    if (currentScenarioIndex + 1 < sessionQueue.length) {
                        setCurrentScenarioIndex(prev => prev + 1);
                        initScenario();
                        setGameState('playing');
                    } else {
                        // For simplicity, just reset to menu
                        alert(`Session Complete! Score: ${sessionScore + feedbackState.score}`);
                        setGameState('mode_select');
                    }
                } else {
                    setDialogueId(nextId);
                    setFeedbackState(null);
                    setGameState('playing');
                }
            };

            // -- RENDERING --

            if (gameState === 'mode_select') return <ModeSelect onSelect={handleModeSelect} />;
            if (gameState === 'difficulty') return <DifficultySelect onSelect={startSession} mode={selectedMode} />;

            // PLAYING STATE
            const currentScenario = sessionQueue[currentScenarioIndex];
            const currentDialogue = currentScenario.dialogueTree[dialogueId];

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-6xl mx-auto bg-gray-100">
                    <div className="flex justify-between items-center mb-4">
                        <div className="text-sm font-bold text-gray-500 uppercase tracking-widest">
                            {selectedMode === 'membership' ? "Membership Desk" : selectedMode === 'scoc' ? "Self-Checkout Area" : "Register Lane"}
                        </div>
                        <button onClick={() => setGameState('mode_select')} className="text-xs text-red-600 underline">Exit Simulation</button>
                    </div>

                    {/* UPDATED GRID CONTAINER: Removed fixed 600px height for mobile, kept for desktop */}
                    <div className="grid md:grid-cols-3 gap-6 md:h-[600px] h-auto">
                        
                        {/* LEFT COLUMN: CONTEXT DISPLAY (CHANGES BY MODE) */}
                        <div className="md:col-span-1 md:h-full">
                            {selectedMode === 'membership' && <MarsScreen data={currentScenario.marsData} />}
                            {selectedMode === 'scoc' && <ScoDisplay data={currentScenario.scoData} />}
                            {selectedMode === 'cashier' && <CashierDisplay data={currentScenario.cashierData} />}
                        </div>

                        {/* RIGHT COLUMN: INTERACTION */}
                        {/* Added fixed height of 500px specifically for MOBILE to ensure chat space, while Desktop remains fluid */}
                        <div className="md:col-span-2 flex flex-col bg-white rounded-lg shadow-xl overflow-hidden border border-gray-200 h-[500px] md:h-full">
                            {/* Chat History */}
                            <div className="flex-1 overflow-y-auto p-6 bg-gray-50 space-y-4">
                                {history.map((entry, idx) => (
                                    <div key={idx} className={`flex ${entry.type === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`max-w-[80%] p-3 rounded-lg text-sm ${
                                            entry.type === 'user' 
                                            ? 'bg-red-600 text-white rounded-br-none' 
                                            : 'bg-white border border-gray-300 text-gray-800 rounded-bl-none shadow-sm'
                                        }`}>
                                            {entry.text}
                                        </div>
                                    </div>
                                ))}
                                <div className="flex justify-start">
                                    <div className="max-w-[80%] p-4 rounded-lg bg-white border border-gray-300 text-gray-800 rounded-bl-none shadow-md animate-fade-in text-base">
                                        <span className="block text-xs text-gray-400 font-bold mb-1 uppercase">Customer</span>
                                        {currentDialogue.npc}
                                    </div>
                                </div>
                            </div>

                            {/* Options */}
                            <div className="p-6 bg-white border-t border-gray-200">
                                <p className="text-xs font-bold text-gray-400 mb-3 uppercase tracking-wider">Select Your Response:</p>
                                <div className="grid gap-3">
                                    {currentDialogue.options.map((opt, idx) => (
                                        <button
                                            key={idx}
                                            onClick={() => handleChoice(opt)}
                                            className="w-full text-left p-4 rounded border border-gray-200 hover:bg-red-50 hover:border-red-300 hover:text-red-700 transition duration-150 text-sm font-medium shadow-sm"
                                        >
                                            {opt.text}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    {gameState === 'feedback' && feedbackState && (
                        <FeedbackModal 
                            feedback={feedbackState.text} 
                            score={feedbackState.score}
                            onNext={advanceDialogue}
                            isEnd={currentScenario.dialogueTree[feedbackState.next]?.end}
                            success={currentScenario.dialogueTree[feedbackState.next]?.success}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Simulator />);
    </script>
</body>
</html>
