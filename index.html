<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BJ's Membership Mastery Simulator</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        body { font-family: 'Roboto', sans-serif; background-color: #f3f4f6; }
        .bjs-red { background-color: #CD122D; }
        .bjs-red-text { color: #CD122D; }
        .mars-header { background-color: #000; color: white; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- DATA & SCENARIOS ---

        const scenarios = [
            {
                id: 1,
                title: "The Gas Conscious Commuter",
                description: "A member complains about gas prices while renewing their basic Club membership.",
                customerName: "Sarah Jenkins",
                marsData: {
                    tier: "The Club Card",
                    expiration: "Expires Today",
                    ytdSpend: "$1,200",
                    offers: ["Cobrand", "Upgrade"],
                    gasUsage: "High"
                },
                dialogueTree: {
                    start: {
                        npc: "Hi, I just need to renew my membership. I'm in a rush, gas prices are killing me and I need to fill up.",
                        options: [
                            { text: "No problem, that will be $55. Go ahead and swipe.", score: 0, next: "fail_passive", feedback: "You processed the transaction but missed a huge opportunity to solve the member's pain point (gas prices)." },
                            { text: "I hear you! Gas is expensive. Did you know if you switch to the BJ's One+ Mastercard, you'd save 15 cents a gallon instantly?", score: 5, next: "pitch_credit_direct", feedback: "Good instinct to address the gas, but the best practice (WOW Pitch) is to anchor the Membership Upgrade first or bundle them." },
                            { text: "I can help with that. Since you drive a lot, I recommend maximizing your savings with our Club+ Membership and the BJ's One+ Mastercard. You'd get 15 cents off every gallon and 5% back on purchases.", score: 10, next: "objection_fee", feedback: "Excellent! You used the 'Anchor High' strategy from the WOW Pitch training, addressing their specific pain point immediately." }
                        ]
                    },
                    fail_passive: {
                        npc: "Thanks. *Member leaves*",
                        end: true,
                        success: false,
                        message: "Missed Opportunity. The member explicitly mentioned gas prices. That is a trigger for the One+ pitch."
                    },
                    pitch_credit_direct: {
                        npc: "I don't need another credit card right now.",
                        options: [
                            { text: "Okay, we can just do the regular renewal then.", score: 0, next: "fail_passive", feedback: "Don't give up so easily! Pivot to the membership tier benefits." },
                            { text: "I understand. Even without the credit card, upgrading to Club+ saves you 5 cents/gallon and earns 2% back. It pays for itself with your spending.", score: 8, next: "success_upgrade", feedback: "Great pivot (The Downsell). You secured the upgrade even if they declined the credit." }
                        ]
                    },
                    objection_fee: {
                        npc: "That sounds nice, but I don't want to pay a higher membership fee. $110 is a lot.",
                        options: [
                            { text: "It is more expensive, but it's worth it.", score: 2, next: "fail_fee", feedback: "Avoid simply agreeing that it's expensive. Use the 'Net-Negative' cost logic." },
                            { text: "I totally get that. But with the rewards you'll earn and the gas savings, we're basically paying you to join. Plus, it has a 100% Money-Back Guarantee. If you don't save enough, we refund the fee.", score: 10, next: "success_bundle", feedback: "Perfect execution. You used 'Risk Reversal' (Money-Back Guarantee) and 'Value Stack' logic." }
                        ]
                    },
                    fail_fee: {
                        npc: "I'll stick with the basic for now.",
                        end: true,
                        success: false,
                        message: "The member didn't see the value. Always use the Money-Back Guarantee to overcome fee objections."
                    },
                    success_upgrade: {
                        npc: "Alright, 5 cents off helps. Let's do the Club+ upgrade.",
                        end: true,
                        success: true,
                        tier: "Club+",
                        message: "Success! You secured a Membership Upgrade by pivoting to value."
                    },
                    success_bundle: {
                        npc: "Well, if there's a guarantee, I guess I have nothing to lose. Let's do it.",
                        end: true,
                        success: true,
                        tier: "One+ Mastercard",
                        message: "Mastery! You secured a Club+ Upgrade AND a Credit App. This is the 'Golden Metric'."
                    }
                }
            },
            {
                id: 2,
                title: "The Big Spender",
                description: "A member has a cart full of electronics and groceries (~$400 value).",
                customerName: "Robert Vance",
                marsData: {
                    tier: "The Club Card",
                    expiration: "05/2026",
                    ytdSpend: "$3,500",
                    offers: ["Upgrade"],
                    gasUsage: "Low"
                },
                dialogueTree: {
                    start: {
                        npc: "(Placing large TV on belt) Just these today. Hoping to get out quick.",
                        options: [
                            { text: "Sure thing, I'll ring you up.", score: 0, next: "fail_passive", feedback: "You ignored the high cart value. MARS shows high YTD spend. This member is losing money by not being Club+." },
                            { text: "Wow, nice TV! Robert, I see you're a loyal shopper. You're currently leaving money on the table by not being a Club+ member.", score: 10, next: "curiosity", feedback: "Great hook. Using the phrase 'leaving money on the table' creates Loss Aversion." },
                            { text: "Do you want to apply for a credit card today to save $40?", score: 5, next: "objection_credit", feedback: "Okay, but a bit aggressive. The Upgrade is the easier sell here first based on his cart size." }
                        ]
                    },
                    fail_passive: {
                        npc: "Thanks.",
                        end: true,
                        success: false,
                        message: "This member spends $3,500/year. 2% rewards would be $70. The upgrade pays for itself immediately."
                    },
                    curiosity: {
                        npc: "What do you mean leaving money on the table?",
                        options: [
                            { text: "With Club+, you get 2% back. On this TV alone, you'd earn a chunk of the upgrade fee back instantly. It's risk-free.", score: 10, next: "success_upgrade", feedback: "Excellent use of immediate math." },
                            { text: "You get coupons and 5 cents off gas.", score: 4, next: "fail_relevance", feedback: "He's buying a TV, not gas. Tailor the benefit to the current purchase." }
                        ]
                    },
                    objection_credit: {
                        npc: "No, I have too many cards.",
                        options: [
                            { text: "Understood. But you should at least upgrade to Club+. You'll earn 2% back on this purchase today.", score: 8, next: "success_upgrade", feedback: "Good pivot to the membership upgrade." }
                        ]
                    },
                    fail_relevance: {
                        npc: "I don't drive much. Just ring it up.",
                        end: true,
                        success: false,
                        message: "Know your customer. Focus on the 2% rewards for high spenders."
                    },
                    success_upgrade: {
                        npc: "If I earn on this TV, that makes sense. Go ahead.",
                        end: true,
                        success: true,
                        tier: "Club+",
                        message: "Success! You identified a high-spender and used the 'Math' to close the upgrade."
                    }
                }
            },
            {
                id: 3,
                title: "The Busy Parent",
                description: "A member buying bulk diapers and snacks, looking visibly stressed/rushed.",
                customerName: "Emily Chen",
                marsData: {
                    tier: "The Club Card",
                    expiration: "01/2026",
                    ytdSpend: "$800",
                    offers: ["Cobrand"],
                    gasUsage: "Med"
                },
                dialogueTree: {
                    start: {
                        npc: "Hi, sorry, my toddler is melting down. Can we make this fast?",
                        options: [
                            { text: "I'll scan as fast as I can!", score: 2, next: "fail_nice_but_missed", feedback: "Polite, but you missed the cue. 'Stressed/Busy' = Convenience Pitch." },
                            { text: "I see you've got your hands full! Did you know Club+ members get free curbside pickup and same-day delivery? You wouldn't even have to come inside next time.", score: 10, next: "interest_convenience", feedback: "Perfect. You identified the 'Time Poverty' friction and offered the 'Convenience Premium' solution." },
                            { text: "Do you want to apply for a Mastercard to save 10 cents on gas?", score: 0, next: "hard_no", feedback: "Wrong time. A stressed parent doesn't want a credit check right now. Pitch the lifestyle benefit." }
                        ]
                    },
                    fail_nice_but_missed: {
                        npc: "Thanks.",
                        end: true,
                        success: false,
                        message: "You were efficient, but missed upgrading a member who clearly needs the Convenience perks (Curbside/Delivery)."
                    },
                    hard_no: {
                        npc: "No! I just want to go home.",
                        end: true,
                        success: false,
                        message: "Read the room. Don't pitch a complex financial product to a distressed member. Pitch the time-saving upgrade."
                    },
                    interest_convenience: {
                        npc: "Free delivery? I thought that cost extra.",
                        options: [
                            { text: "It's included in Club+. Plus 2% rewards. It costs a bit more but saves you hours of shopping.", score: 10, next: "success_upgrade", feedback: "You sold the value of time. This is key for the Fairfax/busy market demographic." }
                        ]
                    },
                    success_upgrade: {
                        npc: "If I don't have to drag the kids out next time, it's worth every penny. Sign me up.",
                        end: true,
                        success: true,
                        tier: "Club+",
                        message: "Success! You solved a lifestyle problem with a membership solution."
                    }
                }
            }
        ];

        // --- COMPONENTS ---

        const MarsScreen = ({ data }) => {
            if (!data) return null;
            return (
                <div className="bg-white border-2 border-gray-300 shadow-lg mb-4 rounded-md overflow-hidden font-sans">
                    <div className="mars-header p-2 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <span className="bg-red-600 text-white font-bold px-2 py-1 rounded">BJ's</span>
                            <span className="font-bold text-xl">MARS 2.0</span>
                        </div>
                        <div className="text-sm">
                            <span className="mr-4">Club 033</span>
                            <span>{data.customerName}</span>
                        </div>
                    </div>
                    <div className="p-4 bg-gray-50">
                        {/* New Layout to prevent cramping */}
                        <div className="grid grid-cols-1 gap-3">
                            
                            {/* Row 1: Full width Tier Info */}
                            <div className="bg-white p-3 border rounded shadow-sm flex justify-between items-center">
                                <div>
                                    <p className="text-xs text-gray-500 uppercase font-bold">Current Tier</p>
                                    <p className={`text-lg font-bold ${data.tier.includes('+') ? 'text-purple-700' : 'bjs-red-text'}`}>
                                        {data.tier}
                                    </p>
                                </div>
                                {data.tier === "The Club Card" && (
                                    <span className="text-xs bg-red-100 text-red-700 px-2 py-1 rounded border border-red-200 font-bold">
                                        Upgrade Avail.
                                    </span>
                                )}
                            </div>

                            {/* Row 2: Status and Spend Side-by-Side */}
                            <div className="grid grid-cols-2 gap-3">
                                <div className="bg-white p-3 border rounded shadow-sm">
                                    <p className="text-xs text-gray-500 uppercase font-bold">Status</p>
                                    <p className="text-gray-800 font-medium">{data.expiration}</p>
                                </div>
                                <div className="bg-white p-3 border rounded shadow-sm">
                                    <p className="text-xs text-gray-500 uppercase font-bold">YTD Spend</p>
                                    <p className="text-gray-800 font-mono font-bold">{data.ytdSpend}</p>
                                </div>
                            </div>

                            {/* Row 3: Full width Offers with Wrapping */}
                            <div className="bg-white p-3 border rounded shadow-sm">
                                <p className="text-xs text-gray-500 uppercase font-bold mb-2">Recommended Offers</p>
                                <div className="flex flex-wrap gap-2">
                                    {data.offers.map(offer => (
                                        <span key={offer} className="bg-blue-50 text-blue-700 text-xs font-bold px-2 py-1 rounded border border-blue-200 shadow-sm">
                                            {offer}
                                        </span>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const FeedbackModal = ({ feedback, score, onNext, isEnd, success }) => {
            const isGood = score >= 5;
            
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-lg p-6 max-w-lg w-full shadow-2xl animate-fade-in-up">
                        <h3 className={`text-xl font-bold mb-2 ${!isGood ? 'text-red-600' : 'text-green-600'}`}>
                            {!isGood ? "Coach's Corner (Improvement Needed)" : "Great Job!"}
                        </h3>
                        <p className="text-gray-700 mb-6">{feedback}</p>
                        <button 
                            onClick={onNext}
                            className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition duration-200"
                        >
                            {isEnd ? (success ? "See Results" : "End Interaction") : "Continue Interaction"}
                        </button>
                    </div>
                </div>
            );
        };

        const Simulator = () => {
            const [gameState, setGameState] = useState('menu'); // menu, playing, feedback, end
            const [currentScenario, setCurrentScenario] = useState(null);
            const [dialogueId, setDialogueId] = useState('start');
            const [totalScore, setTotalScore] = useState(0);
            const [feedbackState, setFeedbackState] = useState(null);
            const [history, setHistory] = useState([]);
            const [finalResult, setFinalResult] = useState(null); // Stores result for end screen to prevent crash

            const startScenario = (scenario) => {
                setCurrentScenario(scenario);
                setDialogueId('start');
                setTotalScore(0);
                setHistory([]);
                setFinalResult(null);
                setGameState('playing');
            };

            const handleChoice = (option) => {
                const currentDialogue = currentScenario.dialogueTree[dialogueId];
                
                // Add to history
                setHistory([...history, { type: 'npc', text: currentDialogue.npc }, { type: 'user', text: option.text }]);
                
                // Update total score
                setTotalScore(prev => prev + option.score);

                // Show feedback modal
                setFeedbackState({
                    text: option.feedback,
                    score: option.score, // Pass the specific option score to determine feedback type
                    next: option.next
                });
                setGameState('feedback');
            };

            const advanceDialogue = () => {
                const nextId = feedbackState.next;
                const nextNode = currentScenario.dialogueTree[nextId];
                
                if (nextNode && nextNode.end) {
                    // Prepare Final Result Data BEFORE clearing feedback or changing state
                    setFinalResult({
                        success: nextNode.success,
                        message: nextNode.message,
                        tier: nextNode.tier || "No Change"
                    });
                    setHistory([...history, { type: 'npc', text: nextNode.npc }]); // Add final NPC line
                    setFeedbackState(null); // Clear feedback
                    setGameState('end'); // Move to end screen
                } else {
                    setDialogueId(nextId);
                    setFeedbackState(null);
                    setGameState('playing');
                }
            };

            const resetGame = () => {
                setGameState('menu');
                setCurrentScenario(null);
                setDialogueId('start');
                setTotalScore(0);
                setHistory([]);
                setFeedbackState(null);
                setFinalResult(null);
            };

            // -- RENDER: MENU --
            if (gameState === 'menu') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-xl shadow-2xl max-w-2xl w-full border-t-8 border-red-600">
                            <div className="flex justify-center mb-6">
                                <h1 className="text-4xl font-bold bjs-red-text tracking-tighter">BJ's Membership Mastery</h1>
                            </div>
                            <p className="text-gray-600 text-center mb-8 text-lg">
                                Select a training scenario to practice your WOW pitch and maximize member value.
                            </p>
                            
                            <div className="grid gap-4">
                                {scenarios.map(scen => (
                                    <button 
                                        key={scen.id}
                                        onClick={() => startScenario(scen)}
                                        className="text-left p-4 border border-gray-200 rounded-lg hover:border-red-500 hover:shadow-md transition duration-200 bg-white group"
                                    >
                                        <h3 className="font-bold text-lg group-hover:text-red-600">{scen.title}</h3>
                                        <p className="text-sm text-gray-500">{scen.description}</p>
                                    </button>
                                ))}
                            </div>
                            <div className="mt-8 text-center text-xs text-gray-400">
                                Based on Sales Training & Strategies • MARS 2.0 • Daily Drive Protocols
                            </div>
                        </div>
                    </div>
                );
            }

            // -- RENDER: END SCREEN --
            if (gameState === 'end') {
                // Now we read from finalResult state, not the cleared feedback state
                const { success, message, tier } = finalResult;
                
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-gray-100">
                        <div className="bg-white p-8 rounded-xl shadow-xl max-w-lg w-full text-center">
                            <div className={`w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-4 ${success ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}`}>
                                <span className="text-4xl">{success ? '✓' : '✗'}</span>
                            </div>
                            <h2 className="text-2xl font-bold mb-2">{success ? 'Outcome: Upgrade Secured!' : 'Outcome: Missed Opportunity'}</h2>
                            <p className="text-gray-600 mb-6">{message}</p>
                            
                            <div className="bg-gray-50 p-4 rounded-lg mb-6 text-left">
                                <h4 className="font-bold text-sm text-gray-500 uppercase mb-2">Performance Scorecard</h4>
                                <div className="flex justify-between mb-1">
                                    <span>Interaction Score:</span>
                                    <span className="font-bold">{totalScore} / 20</span>
                                </div>
                                <div className="flex justify-between mb-1">
                                    <span>Result:</span>
                                    <span className={success ? "text-green-600 font-bold" : "text-red-600 font-bold"}>
                                        {tier}
                                    </span>
                                </div>
                            </div>

                            <button 
                                onClick={resetGame}
                                className="bg-gray-800 text-white px-6 py-2 rounded hover:bg-gray-900 transition"
                            >
                                Return to Menu
                            </button>
                        </div>
                    </div>
                );
            }

            // -- RENDER: PLAYING --
            const currentDialogue = currentScenario.dialogueTree[dialogueId];

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-4xl mx-auto">
                    <div className="flex justify-between items-center mb-4">
                        <button onClick={resetGame} className="text-gray-500 hover:text-red-600 text-sm">← Exit Simulation</button>
                        <div className="text-gray-400 text-sm">Scenario: {currentScenario.title}</div>
                    </div>

                    <div className="grid md:grid-cols-3 gap-6">
                        {/* Left Col: MARS System */}
                        <div className="md:col-span-1">
                            <MarsScreen data={currentScenario.marsData} />
                            
                            <div className="bg-blue-50 border border-blue-200 p-4 rounded-md text-sm text-blue-800">
                                <strong>💡 Daily Drive Tip:</strong>
                                <br/>
                                Always check MARS 2.0 first. Look for "Leaving Money on the Table" (High Spend) or "Convenience" needs.
                            </div>
                        </div>

                        {/* Right Col: Conversation */}
                        <div className="md:col-span-2 flex flex-col h-[600px] bg-white rounded-lg shadow-xl overflow-hidden border border-gray-200">
                            
                            {/* Chat History */}
                            <div className="flex-1 overflow-y-auto p-4 bg-gray-50 space-y-4">
                                {history.map((entry, idx) => (
                                    <div key={idx} className={`flex ${entry.type === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`max-w-[80%] p-3 rounded-lg ${
                                            entry.type === 'user' 
                                            ? 'bg-red-600 text-white rounded-br-none' 
                                            : 'bg-white border border-gray-300 text-gray-800 rounded-bl-none shadow-sm'
                                        }`}>
                                            {entry.text}
                                        </div>
                                    </div>
                                ))}
                                
                                {/* Current NPC Line */}
                                <div className="flex justify-start">
                                    <div className="max-w-[80%] p-3 rounded-lg bg-white border border-gray-300 text-gray-800 rounded-bl-none shadow-sm animate-fade-in">
                                        <span className="block text-xs text-gray-400 font-bold mb-1 uppercase">Member</span>
                                        {currentDialogue.npc}
                                    </div>
                                </div>
                            </div>

                            {/* Options Area */}
                            <div className="p-4 bg-white border-t border-gray-200">
                                <p className="text-sm font-bold text-gray-500 mb-3 uppercase">Your Response:</p>
                                <div className="space-y-2">
                                    {currentDialogue.options.map((opt, idx) => (
                                        <button
                                            key={idx}
                                            onClick={() => handleChoice(opt)}
                                            className="w-full text-left p-3 rounded border border-gray-300 hover:bg-red-50 hover:border-red-300 hover:text-red-700 transition duration-150 text-sm"
                                        >
                                            {opt.text}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Feedback Modal Overlay */}
                    {gameState === 'feedback' && feedbackState && (
                        <FeedbackModal 
                            feedback={feedbackState.text} 
                            score={feedbackState.score}
                            onNext={advanceDialogue}
                            isEnd={currentScenario.dialogueTree[feedbackState.next]?.end}
                            success={currentScenario.dialogueTree[feedbackState.next]?.success}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Simulator />);
    </script>
</body>
</html>
