        // --- COMPONENTS (Unchanged Logic, added Keys for forcing re-render) ---

        const MarsScreen = ({ data }) => {

        // --- GAME CONTROLLERS ---

        const FeedbackModal = ({ feedback, score, onNext, isEnd, success }) => {
            const isGood = score >= 5;
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-lg p-6 max-w-lg w-full shadow-2xl animate-fade-in-up border-t-4 border-red-600">

        const ModeSelect = ({ onSelect }) => {

        const DifficultySelect = ({ onSelect, mode }) => {
            const modeName = mode === 'membership' ? "Membership" : mode === 'scoc' ? "Self-Checkout" : "Cashier";
            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4">
                    <div className="bg-white p-8 rounded-xl shadow-2xl max-w-2xl w-full border-t-8 border-gray-800 text-center">
                        <h2 className="text-2xl font-bold mb-2 text-gray-800">Select Difficulty</h2>
                        <p className="text-gray-500 mb-6 uppercase text-sm font-bold tracking-widest">{modeName} Mode</p>
                        <div className="grid gap-4">
                            <button onClick={() => onSelect('Easy')} className="p-4 bg-green-50 border border-green-200 rounded hover:bg-green-100 transition text-left">
                                <h3 className="font-bold text-green-800 text-lg">Easy (5 Scenarios)</h3>
                            </button>
                            <button onClick={() => onSelect('Medium')} className="p-4 bg-yellow-50 border border-yellow-200 rounded hover:bg-yellow-100 transition text-left">
                                <h3 className="font-bold text-yellow-800 text-lg">Medium (5 Scenarios)</h3>
                            </button>
                            <button onClick={() => onSelect('Hard')} className="p-4 bg-red-50 border border-red-200 rounded hover:bg-red-100 transition text-left">
                                <h3 className="font-bold text-red-800 text-lg">Hard (5 Scenarios)</h3>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const Simulator = () => {
            const [gameState, setGameState] = useState('mode_select');
            const [selectedMode, setSelectedMode] = useState(null);
            const [sessionQueue, setSessionQueue] = useState([]);
            const [currentScenarioIndex, setCurrentScenarioIndex] = useState(0);
            
            const [dialogueId, setDialogueId] = useState('start');
            const [feedbackState, setFeedbackState] = useState(null);
            const [history, setHistory] = useState([]); 
            const [sessionScore, setSessionScore] = useState(0);

            const handleModeSelect = (mode) => {
                setSelectedMode(mode);
                setGameState('difficulty');
            };

            const startSession = (difficulty) => {
                // Ensure we get ALL matching scenarios
                const pool = scenarioDatabase.filter(s => s.difficulty === difficulty && s.mode === selectedMode);
                
                if (pool.length === 0) {
                    alert("No scenarios found. Please reload.");
                    setGameState('mode_select');
                    return;
                }

                const shuffled = [...pool].sort(() => 0.5 - Math.random());
                setSessionQueue(shuffled);
                setCurrentScenarioIndex(0);
                setSessionScore(0);
                
                initScenario();
                setGameState('playing');
            };

            const initScenario = () => {
                setDialogueId('start');
                setHistory([]);
                setFeedbackState(null);
            };

            const handleChoice = (option) => {
                const currentScenario = sessionQueue[currentScenarioIndex];
                const currentDialogue = currentScenario.dialogueTree[dialogueId];
                setHistory([...history, { type: 'npc', text: currentDialogue.npc }, { type: 'user', text: option.text }]);
                setSessionScore(prev => prev + option.score);
                setFeedbackState({ text: option.feedback, score: option.score, next: option.next });
                setGameState('feedback');
            };

            const advanceDialogue = () => {
                const currentScenario = sessionQueue[currentScenarioIndex];
                const nextId = feedbackState.next;
                const nextNode = currentScenario.dialogueTree[nextId];
                
                if (nextNode && nextNode.end) {
                    if (currentScenarioIndex + 1 < sessionQueue.length) {
                        // Move to next scenario
                        setCurrentScenarioIndex(prev => prev + 1);
                        initScenario();
                        setGameState('playing');
                    } else {
                        // End Session
                        alert(`Session Complete! Final Score: ${sessionScore + feedbackState.score}`);
                        setGameState('mode_select');
                    }
                } else {
                    setDialogueId(nextId);
                    setFeedbackState(null);
                    setGameState('playing');
                }
            };

            if (gameState === 'mode_select') return <ModeSelect onSelect={handleModeSelect} />;
            if (gameState === 'difficulty') return <DifficultySelect onSelect={startSession} mode={selectedMode} />;

            const currentScenario = sessionQueue[currentScenarioIndex];
            const currentDialogue = currentScenario.dialogueTree[dialogueId];

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-6xl mx-auto bg-gray-100">
                    <div className="flex justify-between items-center mb-4">
                        <div className="text-sm font-bold text-gray-500 uppercase tracking-widest">
                            Scenario {currentScenarioIndex + 1} of {sessionQueue.length}
                        </div>
                        <button onClick={() => setGameState('mode_select')} className="text-xs text-red-600 underline">Exit Simulation</button>
                    </div>

                    {/* KEY PROP FORCES RE-RENDER ON NEW SCENARIO */}
                    <div key={currentScenario.id} className="grid md:grid-cols-3 gap-6 md:h-[600px] h-auto animate-fade-in">
                        <div className="md:col-span-1 md:h-full">
                            {selectedMode === 'membership' && <MarsScreen data={currentScenario.marsData} />}
                            {selectedMode === 'scoc' && <ScoDisplay data={currentScenario.scoData} />}
                            {selectedMode === 'cashier' && <CashierDisplay data={currentScenario.cashierData} />}
                        </div>
                        <div className="md:col-span-2 flex flex-col bg-white rounded-lg shadow-xl overflow-hidden border border-gray-200 h-[500px] md:h-full">
                            <div className="flex-1 overflow-y-auto p-6 bg-gray-50 space-y-4">
                                {history.map((entry, idx) => (
                                    <div key={idx} className={`flex ${entry.type === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`max-w-[80%] p-3 rounded-lg text-sm ${entry.type === 'user' ? 'bg-red-600 text-white rounded-br-none' : 'bg-white border border-gray-300 text-gray-800 rounded-bl-none shadow-sm'}`}>
                                            {entry.text}
                                        </div>
                                    </div>
                                ))}
                                <div className="flex justify-start">
                                    <div className="max-w-[80%] p-4 rounded-lg bg-white border border-gray-300 text-gray-800 rounded-bl-none shadow-md animate-fade-in text-base">
                                        <span className="block text-xs text-gray-400 font-bold mb-1 uppercase">Customer</span>
                                        {currentDialogue.npc}
                                    </div>
                                </div>
                            </div>
                            <div className="p-6 bg-white border-t border-gray-200">
                                <p className="text-xs font-bold text-gray-400 mb-3 uppercase tracking-wider">Select Your Response:</p>
                                <div className="grid gap-3">
                                    {currentDialogue.options.map((opt, idx) => (
                                        <button key={idx} onClick={() => handleChoice(opt)} className="w-full text-left p-4 rounded border border-gray-200 hover:bg-red-50 hover:border-red-300 hover:text-red-700 transition duration-150 text-sm font-medium shadow-sm">
                                            {opt.text}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                    {gameState === 'feedback' && feedbackState && (
                        <FeedbackModal feedback={feedbackState.text} score={feedbackState.score} onNext={advanceDialogue} isEnd={currentScenario.dialogueTree[feedbackState.next]?.end} success={currentScenario.dialogueTree[feedbackState.next]?.success} />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Simulator />);
    </script>
</body>
</html>
